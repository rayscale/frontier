name: Publish

# Publishes @rayscale/frontier to npm when main holds a version that npm does not have yet.
# The tag and the GitHub release are made afterwards with `pnpm release:github`.
# It signs in to npm with trusted publishing (OIDC), so no token is stored in the repository.
# The trusted publisher on npmjs.com must name this file: publish.yml.
on:
  push:
    branches:
      - main
  # Runs it again by hand when a run failed halfway.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # A manual run can start on any branch. Only main is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Read the version and what is left to do
        id: release
        working-directory: packages/frontier
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          # Until there is a stable version, the newest prerelease is `latest`, which is what npm
          # shows and installs. After that, 1.1.0-alpha.0 goes out under the alpha tag.
          channel=latest
          latest="$(npm view "${name}" dist-tags.latest)"
          if [[ "${version}" == *-* && "${latest}" != *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
          fi

          # Only "not found" means unpublished. Any other registry error stops the run.
          publish=false
          if ! output="$(npm view "${name}@${version}" version 2>&1)"; then
            if [[ "${output}" != *E404* ]]; then
              echo "${output}" >&2
              exit 1
            fi
            publish=true
          elif [ -z "${output}" ]; then
            publish=true
          fi

          {
            echo "channel=${channel}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.release.outputs.publish == 'true'
        run: pnpm --filter @rayscale/frontier test

      - name: Type-check
        if: steps.release.outputs.publish == 'true'
        run: pnpm --filter @rayscale/frontier typecheck

      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: pnpm --filter @rayscale/frontier build

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        working-directory: packages/frontier
        run: |
          npm --version
          npm publish --ignore-scripts --tag "${{ steps.release.outputs.channel }}"
