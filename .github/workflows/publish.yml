name: Publish

# Publishes @rayscale/frontier to npm when main holds a version that npm does not have yet, then
# tags the commit and creates the GitHub release from the CHANGELOG.
# It signs in to npm with trusted publishing (OIDC), so no token is stored in the repository.
# The trusted publisher on npmjs.com must name this file: publish.yml.
on:
  push:
    branches:
      - main
  # Runs it again by hand when a run failed halfway.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # A manual run can start on any branch. Only main is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Read the version and what is left to do
        id: release
        working-directory: packages/frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          # A version such as 0.1.0-alpha.0 goes out under the alpha tag, not latest.
          channel=latest
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
            prerelease=true
          fi

          # Only "not found" means unpublished. Any other registry error stops the run.
          publish=false
          if ! output="$(npm view "${name}@${version}" version 2>&1)"; then
            if [[ "${output}" != *E404* ]]; then
              echo "${output}" >&2
              exit 1
            fi
            publish=true
          elif [ -z "${output}" ]; then
            publish=true
          fi

          release=false
          if ! gh release view "v${version}" > /dev/null 2>&1; then
            release=true
          fi

          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.release.outputs.publish == 'true'
        run: pnpm --filter @rayscale/frontier test

      - name: Type-check
        if: steps.release.outputs.publish == 'true'
        run: pnpm --filter @rayscale/frontier typecheck

      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: pnpm --filter @rayscale/frontier build

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        working-directory: packages/frontier
        run: |
          npm --version
          npm publish --ignore-scripts --tag "${{ steps.release.outputs.channel }}"

      - name: Tag the commit and create the GitHub release
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          # The notes are the section of this version in the CHANGELOG.
          awk -v heading="## ${VERSION}" '$0 == heading { found = 1; next } /^## / { found = 0 } found' \
            packages/frontier/CHANGELOG.md > "${RUNNER_TEMP}/notes.md"

          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" --prerelease="${PRERELEASE}"
