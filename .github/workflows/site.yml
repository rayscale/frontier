name: Site

on:
  push:
    paths:
      - 'apps/site/**'
      - 'packages/frontier/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'packages/frontier/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the site uses
        run: pnpm --filter "@rayscale/site^..." build

      - name: Test
        run: pnpm --filter @rayscale/site test

      - name: Type-check
        run: pnpm --filter @rayscale/site typecheck

      - name: Build
        run: pnpm --filter @rayscale/site build
